name: Release

# Releases are cut from `releases/MAJOR.MINOR.PATCH` branches (which are
# protected). Pushing such a branch builds every executable, bundles them into a
# tar.gz, and publishes a GitHub release tagged `vMAJOR.MINOR.PATCH`.

on:
  push:
    branches: ["releases/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZEL_VERSION: "8.5.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          case "${GITHUB_REF_NAME}" in
            releases/*) VERSION="${GITHUB_REF_NAME#releases/}" ;;
            *)
              echo "::error::Release must run on a 'releases/MAJOR.MINOR.PATCH' branch (got '${GITHUB_REF_NAME}')." >&2
              exit 1
              ;;
          esac
          VERSION="${VERSION#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release branch must be named 'releases/MAJOR.MINOR.PATCH' (got '${VERSION}')." >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "pkgdir=universal_protocol_runtime-${VERSION}-linux_amd64"
          } >> "${GITHUB_OUTPUT}"

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.0
        with:
          bazel_version: ${{ env.BAZEL_VERSION }}

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/bazel-disk-cache
            ${{ runner.temp }}/bazel-repo-cache
          key: bazel-release-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-release-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}-
            bazel-release-

      - name: Build and bundle executables
        id: pkg
        env:
          BAZEL_CI_DISK_CACHE_DIR: ${{ runner.temp }}/bazel-disk-cache
          BAZEL_CI_REPOSITORY_CACHE_DIR: ${{ runner.temp }}/bazel-repo-cache
          PKGDIR: ${{ steps.meta.outputs.pkgdir }}
        run: |
          set -euo pipefail
          BAZEL="tools/ci/bazel_ci.sh"
          BUILD_FLAGS=(--config=linux --compilation_mode=opt --strip=always)

          "${BAZEL}" build "${BUILD_FLAGS[@]}" //...

          rm -rf "${PKGDIR}"
          mkdir -p "${PKGDIR}/bin"

          # Copy every C++ executable (in its target configuration) into the
          # bundle, skipping shared libraries produced via cc_binary.
          count=0
          while read -r label path; do
            [ -z "${label}" ] && continue
            case "${path}" in *.so) continue ;; esac
            [ -f "${path}" ] || continue
            install -m 0755 "${path}" "${PKGDIR}/bin/${label##*:}"
            count=$((count + 1))
          done < <(
            "${BAZEL}" cquery "${BUILD_FLAGS[@]}" \
              'config(kind("cc_binary rule", //...), target)' \
              --output=starlark \
              --starlark:expr='str(target.label) + " " + target.files_to_run.executable.path' \
              2>/dev/null
          )

          if [ "${count}" -eq 0 ]; then
            echo "::error::No executables were found to package." >&2
            exit 1
          fi
          echo "Packaged ${count} executable(s)."

          cp LICENSE README.md "${PKGDIR}/"
          tar czf "${PKGDIR}.tar.gz" "${PKGDIR}"
          sha256sum "${PKGDIR}.tar.gz" > "${PKGDIR}.tar.gz.sha256"

          {
            echo "package=${PKGDIR}.tar.gz"
            echo "checksum=${PKGDIR}.tar.gz.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build language packages
        id: langpkg
        env:
          BAZEL_CI_DISK_CACHE_DIR: ${{ runner.temp }}/bazel-disk-cache
          BAZEL_CI_REPOSITORY_CACHE_DIR: ${{ runner.temp }}/bazel-repo-cache
        run: |
          set -euo pipefail
          BAZEL="tools/ci/bazel_ci.sh"
          BUILD_FLAGS=(--config=linux --compilation_mode=opt --strip=always)

          # Build the Python wheel and the npm package tree entirely via Bazel.
          "${BAZEL}" build "${BUILD_FLAGS[@]}" \
            //packages/upr_python:wheel \
            //packages/upr_typescript:npm_pkg

          mkdir -p dist

          wheel="$(
            "${BAZEL}" cquery "${BUILD_FLAGS[@]}" //packages/upr_python:wheel \
              --output=files 2>/dev/null
          )"
          cp "${wheel}" dist/

          npm_dir="$(
            "${BAZEL}" cquery "${BUILD_FLAGS[@]}" //packages/upr_typescript:npm_pkg \
              --output=files 2>/dev/null
          )"
          # The dist/ tree is already built by Bazel, so skip the package's
          # prepack (tsc) lifecycle script.
          npm pack "./${npm_dir}" --ignore-scripts --pack-destination dist

          {
            echo "wheel=$(ls dist/*.whl)"
            echo "npm_tarball=$(ls dist/*.tgz)"
            echo "npm_dir=${npm_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Universal Protocol Runtime ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.package }}
            ${{ steps.pkg.outputs.checksum }}
            ${{ steps.langpkg.outputs.wheel }}
            ${{ steps.langpkg.outputs.npm_tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python wheel to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN secret not set; skipping PyPI publish."
            exit 0
          fi
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive \
            -u __token__ -p "${PYPI_TOKEN}" dist/*.whl

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish."
            exit 0
          fi
          npm publish "./${{ steps.langpkg.outputs.npm_dir }}" \
            --ignore-scripts --access public
