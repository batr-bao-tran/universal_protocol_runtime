protocol: market_data
imports:
  - examples/schema/order_types.yaml
messages:
  - name: Order
    fields:
      - name: message_type
        type: uint8
        expect: 1
      - name: symbol
        type: string
        encoding: ascii
        size: 4
      - name: price
        type: float32_le
      - name: quantity
        type: uint32_le
      - name: side
        type: Side
      - name: order_type
        type: OrderType
