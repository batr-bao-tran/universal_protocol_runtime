syntax = "proto3";

package upr_benchmarks_proto;

option optimize_for = LITE_RUNTIME;

message BlobEnvelope {
  uint32 message_type = 1;
  bytes payload = 2;
  uint32 checksum = 3;
}

message MarketData {
  uint32 message_type = 1;
  uint32 instrument_id = 2;
  uint32 sequence = 3;
  uint64 exchange_time_ns = 4;
  uint64 receive_time_ns = 5;
  double last_price = 6;
  uint32 last_qty = 7;
  uint32 bid_qty = 8;
  uint32 ask_qty = 9;
  uint32 bid_price_micros = 10;
  uint32 ask_price_micros = 11;
  string symbol = 12;
  uint32 flags = 13;
  uint32 checksum = 14;
}
