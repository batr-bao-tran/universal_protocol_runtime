[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-protocol-runtime"
version = "0.1.0"
description = "Pure-Python encoder/decoder, framing and session helpers for the Universal Protocol Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Universal Protocol Runtime" }]
keywords = ["binary", "protocol", "codec", "serialization", "upr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/universal-protocol-runtime/universal_protocol_runtime"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_protocol_runtime = ["py.typed"]
